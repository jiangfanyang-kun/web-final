<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>首页界面</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/lib/layui-v2.6.3/css/layui.css">
    <style>
        #data {
            margin: 20px 30px 30px 30px;
            color: white;
            height: 280px;
            overflow: hidden;
        }
        #data .data_box {
            margin: 0 auto;
            margin-top: 15px;
            background-color: rgba(32,87,120, 0.5);
            font-size: 20px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            height: 38px;
            line-height: 38px;
            padding: 0 18px;
            border: 1px solid transparent;
            background-color: #009688;
            color: #fff;
            white-space: nowrap;
            text-align: center;
            font-size: 14px;
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<!--内容部分-->
<div class="con left">
    <!--选择时间-->
    <div class="select_time">
        <div class="static_top left">
            <i></i><span>交通状况：<span id="road"></span>&nbsp;&nbsp;|&nbsp;&nbsp;FPS：<span id="fps"></span></span>
        </div>
    </div>
    <!--数据总概-->
    <div class="con_div">
        <div class="con_div_text left">
            <div class="con_div_text01 left">
                <img src="../static/img/info_6.png" class="left text01_img"/>
                <div class="left text01_div">
                    <p>页面总数</p>
                    <p id="car_num"></p>
                </div>
            </div>
        </div>
        <div class="con_div_text left">
            <div class="con_div_text01 left">
                <img src="../static/img/info_4.png" class="left text01_img"/>
                <div class="left text01_div">
                    <p>行人数量</p>
                    <p class="sky" id="people"></p>
                </div>
            </div>
        </div>
        <div class="con_div_text left">

            <div class="con_div_text01 left">
                <img src="../static/img/info_1.png" class="left text01_img"/>
                <div class="left text01_div">
                    <p>车辆数量</p>
                    <p class="org" id="car"></p>
                </div>
            </div>
        </div>
    </div>
    <!--统计分析图-->
    <div class="div_any">
        <div class="div_any02 left ">
            <div class="div_any_child div_height">
                <div class="div_any_title any_title_width"><img src="../static/img/title_3.png">视频 </div>
           <div id="video" style="
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-sizing: border-box;
    background: #06182f;
">
    <img
        id="traffic-video"
        src="{{ url_for('video_feed', feed_type='Camera_0') }}"
        style="
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        "
    >
</div>
            </div>
        </div>
        <div class="right div_any01">
            <div class="div_any_child">
                <div class="div_any_title"><img src="../static/img/title_4.png">来往车辆ID和类型统计 </div>
                <div id="data"></div>
                <div id="traffic-alert-panel" style="
    width: 100%;
    box-sizing: border-box;
    margin-top: 10px;
    padding: 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
">

    <div style="
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 8px;
    ">
        实时预警中心
    </div>

    <div id="traffic-alert-list" style="
        max-height: 180px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.7;
    ">
        暂无预警
    </div>

</div>
                <div style="margin-left: 70px;">
                    <button class="btn" id="analyse">流量分析</button>
                    <a href="/photo_1.html" style="color: white" target="_blank"><button class="btn" style="margin-left: 20px;">通过取景</button></a>
                    <a href="/photo_2.html" style="color: white" target="_blank"><button class="btn" style="margin-left: 20px;">事故取景</button></a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../static/js/jquery/jQuery-2.2.0.min.js"></script>
<script src="../static/js/base.js"></script>
<script>
    setInterval("load()",1000);
</script>
<script>
    function load() {
        $.ajax({
            url: "./json_dict_style.json",
            type: "GET",
            dataType: "json",
            async: false,
            success: function (data) {
                let fps = document.querySelector('#fps');
                fps.innerText = data.FPS;
            }
        });
        $.ajax({
            url: "./json_dict.json",
            type: "GET",
            dataType: "json",
            async: false,
            success: function (data) {
                let car_num = document.querySelector('#car_num');
                let road = document.querySelector('#road');
                car_num.innerText = data.len_list;
                road.innerText = data.style;
            }
        });
        $.ajax({
            url: "./json_dict_sum.json",
            type: "GET",
            dataType: "json",
            async: false,
            success: function (data) {
                let car = document.querySelector('#car');
                let people = document.querySelector('#people');
                car.innerText = data.Sum_vehicle;
                people.innerText = data.Sum_person;
            }
        });
        $.ajax({
            url: "./json_dict_label.json",
            type: "GET",
            dataType: "json",
            async: false,
            success: function (data) {
                let code = "";
                for (var i = 0 ; i < data.length; i++){
                   let info =
    "目标ID：" + data[i].id
    + "，目标类型：" + data[i].label
    + "，速度：" + Number(data[i].speed_px_s || 0).toFixed(2) + " px/s"
    + "，状态：" + (data[i].motion_status || "未知")
    + "，静止：" + Number(data[i].stationary_duration || 0).toFixed(2) + "s"
    + "，预警：" + (data[i].warning_status || "正常");
                    let div = '<div class="data_box">' + info + "</div>";
                    code = div + code;
                }
                let ele_data = document.getElementById("data");
                ele_data.innerHTML = code;
            }
        });
                // =====================================================
        // 实时交通预警中心
        // =====================================================

        $.ajax({
            url: "./json_traffic_alerts.json",
            type: "GET",
            dataType: "json",
            async: false,

            success: function (data) {

                let alertList =
                    document.getElementById(
                        "traffic-alert-list"
                    );

                // 没有预警
                if (
                    !Array.isArray(data)
                    ||
                    data.length === 0
                ) {

                    alertList.innerHTML =
                        '<div style="color:#8fd3ff;">'
                        + '暂无预警'
                        + '</div>';

                    return;
                }


                let code = "";

                for (
                    let i = 0;
                    i < data.length;
                    i++
                ) {

                    let item = data[i];

                    // -----------------------------------------
                    // 风险等级显示
                    // -----------------------------------------

                    let levelText = "低风险";
                    let levelColor = "#ffd666";

                    if (item.level === "high") {

                        levelText = "高风险";
                        levelColor = "#ff4d4f";

                    } else if (
                        item.level === "medium"
                    ) {

                        levelText = "中风险";
                        levelColor = "#fa8c16";
                    }


                    // -----------------------------------------
                    // 预警类型中文名称
                    // -----------------------------------------

                    let typeText = "交通风险";

                    if (
                        item.type
                        ===
                        "abnormal_stop"
                    ) {

                        typeText = "异常停车";

                    } else if (
                        item.type
                        ===
                        "wrong_way"
                    ) {

                        typeText = "逆行预警";

                    } else if (
                        item.type
                        ===
                        "collision_risk"
                    ) {

                        typeText = "碰撞风险";

                    } else if (
                        item.type
                        ===
                        "pedestrian_risk"
                    ) {

                        typeText = "人车冲突";

                    } else if (
                        item.type
                        ===
                        "following_too_close"
                    ) {

                        typeText = "跟车过近";
                    }


                    // -----------------------------------------
                    // 单条预警 HTML
                    // -----------------------------------------

                    let div =
                        '<div style="'
                        + 'margin-bottom:6px;'
                        + 'padding:6px 8px;'
                        + 'background:rgba(0,0,0,0.18);'
                        + 'border-left:3px solid '
                        + levelColor
                        + ';'
                        + '">'

                        + '<span style="color:'
                        + levelColor
                        + ';font-weight:bold;">'
                        + '['
                        + levelText
                        + '] '
                        + typeText
                        + '</span>'

                        + '<br>'

                        + '<span style="color:#ffffff;">'
                        + (
                            item.message
                            ||
                            "检测到交通风险"
                        )
                        + '</span>'

                        + '</div>';

                    code += div;
                }

                alertList.innerHTML = code;
            },

            error: function () {

                let alertList =
                    document.getElementById(
                        "traffic-alert-list"
                    );

                alertList.innerHTML =
                    '<div style="color:#999;">'
                    + '预警数据暂不可用'
                    + '</div>';
            }
        });
    }
</script>
<script src="../static/lib/layui-v2.6.3/layui.js"></script>
<script src="../static/js/lay-config.js?v=1.0.4" charset="utf-8"></script>
<script>
    layui.use(['form'], function () {
        var $ = layui.jquery;
        let ele_analyse = document.getElementById("analyse");
        ele_analyse.addEventListener('click', function () {
            var index = layer.open({
                title: '流量分析',
                type: 2,
                shade: 0.2,
                maxmin:true,
                shadeClose: true,
                area: ['30%', '60%'],
                content: './web-analyse.html',
            });
            $(window).on("resize", function () {
                layer.full(index);
            });
        })
    });
</script>
</body>
</html>
